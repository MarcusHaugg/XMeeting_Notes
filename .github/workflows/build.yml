# Gera os instaladores do XMeeting Notes para Windows, macOS e Linux.
# Cada sistema é compilado na sua própria máquina (o .dmg do macOS só pode ser feito num Mac).
# Os arquivos ficam em "Artifacts" na página da execução (aba Actions do repositório).
name: Build XMeeting Notes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest # Apple Silicon (M1 em diante)
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          # O app transcreve no processador; sem isto o Linux baixa ~550 MB de binários CUDA (NVIDIA) inúteis.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Gerar instalador
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: XMeeting-Notes-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
