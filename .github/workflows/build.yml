# Gera os instaladores do XMeeting Notes para Windows, macOS e Linux.
# Cada sistema é compilado na sua própria máquina (o .dmg do macOS só pode ser feito num Mac).
# Os arquivos ficam em "Artifacts" na página da execução (aba Actions do repositório).
#
# Numa versão (tag v*, igual à "version" do package.json), os instaladores dos 3 sistemas também
# vão juntos para a página de Releases deste repositório.
name: Build XMeeting Notes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest # Apple Silicon (M1 em diante)
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # app-config.json fica fora do git. Configure em Settings → Secrets and variables → Actions:
      # variáveis XMEETING_GOOGLE_CLIENT_ID, XMEETING_BACKEND_URL, XMEETING_COMPANY_DOMAINS
      # e o segredo XMEETING_GOOGLE_CLIENT_SECRET.
      - name: Gerar app-config.json
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('app-config.json', JSON.stringify({
            googleClientId: process.env.CLIENT_ID || '',
            googleClientSecret: process.env.CLIENT_SECRET || '',
            backendUrl: process.env.BACKEND_URL || '',
            companyDomains: process.env.COMPANY_DOMAINS || ''
          }, null, 2))"
        env:
          CLIENT_ID: ${{ vars.XMEETING_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.XMEETING_GOOGLE_CLIENT_SECRET }}
          BACKEND_URL: ${{ vars.XMEETING_BACKEND_URL }}
          COMPANY_DOMAINS: ${{ vars.XMEETING_COMPANY_DOMAINS }}

      - name: Gerar instalador
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: XMeeting-Notes-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Publica uma vez só, depois dos 3 sistemas ficarem prontos.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($version)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          name: XMeeting Notes ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            Instaladores (em **Assets**, abaixo):

            - **Windows 10/11**: `XMeeting-Notes-<versão>-win-x64.exe`
            - **macOS 14.2+ (Apple Silicon)**: `XMeeting-Notes-<versão>-mac-arm64.dmg`
            - **Linux**: `.AppImage` ou `.deb`

            Para atualizar, instale por cima da versão anterior: reuniões e configurações continuam no computador.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
